<app-color-theme-selector></app-color-theme-selector>
<br /><br />

<app-input
  [enabled]="true"
  [(value)]="inputValue"
  [valid]="true"
  width="300px"
  height="30px"
  hint="Enter a value here"
></app-input>
<br /><br />
{{inputValue}}
<br /><br />

<app-switch
  [(value)]="switchValue"
  width="70px"
  height="30px"
  color="red"
  [enabled]="true"
></app-switch>
{{ this.switchValue ? 'true' : 'false' }}
<br /><br />

<app-progress-bar
  [loading]="!this.switchValue"
  color="blue"
  [value]="0.4823874320"
  [valueVisible]="true"
></app-progress-bar>
<br /><br />

<app-button
  value='Button text'
  textAlign="left"
  width="300px"
  height="30px" 
  icon="favicon.ico"
  iconAlign="left"
  [enabled]="true"
  (onClick)="onButtonClick()"
  color="blue"
></app-button>
<br /><br />

<app-card
  imageRef="pic.png"
  imagePosition="left"
></app-card>
<br /><br />

@if ( router.url === '/' ) {



<!-- --- This is the content of the main page ---------------------------------------------- -->
  Main page
<!-- --- End of main page ------------------------------------------------------------------ -->



} @else {



<!-- --- This is the layout of everyt other page ------------------------------------------- -->

  <gui-sidebar></gui-sidebar>

  @for (configItem of this.router.config; track configItem) {
    <div>{{ configItem.path }}</div>
  }

  <router-outlet />

<!-- --- End of every other page ---------------------------------------------------------- -->



}
