
@if ( router.url === '/') {



<!-- --- This is the content of the main page ---------------------------------------------- -->
  Main page
<!-- --- End of main page ------------------------------------------------------------------ -->



} @else {

  @if ( router.url !== '/components-showcase' ) {

    <!-- --- This is the layout of every other page ------------------------------------------- -->

    <app-bar
      barType="top"
      [floating]="true"
      [autoHiding]="true"
    >
      <div left-content>
        <h1>{{ this.getSelectedMenuItemText() }}</h1>
      </div>
      <div right-content>
        <app-color-theme-selector></app-color-theme-selector>
      </div>
    </app-bar>

    <app-menu
      [items]="this.menuItems"
      position="left"
      [(selectedItem)]="this.selectedMenuItem"
    ></app-menu>

    <!-- --- End of every other page ---------------------------------------------------------- -->

  } 

  <router-outlet />

}
