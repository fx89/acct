@if ( this.isAccountSelected() ) {
    <app-account-records
        [selectedAccount]="this.getSelectedAccount()"
        (selectedAccountCleared)="this.onSelectedAccountCleared()"
    ></app-account-records>
} @else {
    <app-account-selection
        (selectedAccountChange)="this.onSelectedAccountChange($event)"
    ></app-account-selection>
}
